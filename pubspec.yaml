name: arena
description: "Arena - Sport va O'yin Zallari Boshqaruv Tizimi"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # ── State Management ────────────────────────────
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # ── Navigation ──────────────────────────────────
  go_router: ^18.1.4

  # ── Offline Baza (SQLite / Drift) ───────────────
  drift: ^2.21.0
  drift_flutter: ^0.3.1
  sqlite3_flutter_libs: ^0.6.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # ── Bulut (Supabase) ────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Utilitalar ──────────────────────────────────
  intl: ^0.20.3
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^7.3.2
  collection: ^1.19.1
  crypto: ^3.0.8
  http: ^1.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ─────────────────────────────
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^4.0.10

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
