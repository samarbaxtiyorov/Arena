name: arena
description: "Arena - Sport va O'yin Zallari Boshqaruv Tizimi"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter

  # ── UI ──────────────────────────────────────────
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1

  # ── State Management ────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Navigation ──────────────────────────────────
  go_router: ^14.8.1

  # ── Offline Baza (SQLite / Drift) ───────────────
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.5
  path: ^1.9.0

  # ── Bulut (Supabase) ────────────────────────────
  supabase_flutter: ^2.8.4

  # ── Utilitalar ──────────────────────────────────
  intl: ^0.19.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.3
  connectivity_plus: ^6.1.4
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # ── Code Generation ─────────────────────────────
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  riverpod_generator: ^2.6.1
  custom_lint: ^0.7.5
  riverpod_lint: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
