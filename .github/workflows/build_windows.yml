name: Build Champion Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Champion Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release Executable
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Champion-Windows-x64.zip
          Get-ChildItem -Path dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Champion-Windows-x64
          path: dist\Champion-Windows-x64.zip
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: desktop-v2.0
          name: "Champion POS — Windows Desktop Versiyasi (v2.0)"
          body: |
            Champion POS — Sport maydonlari va o'yin klublari boshqaruv tizimi (Windows x64).
            
            Arxiv ichida:
            - `Champion.exe`
            - `data/` va barcha zaruriy tizim DLL kutubxonalari.
          files: dist\Champion-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
