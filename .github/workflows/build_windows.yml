name: Build Arena Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Arena Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release Executable
        shell: pwsh
        run: |
          flutter build windows --release -v 2>&1 | Tee-Object -FilePath build_output.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Flutter build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Upload Build Output Log (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-output-log
          path: build_output.txt

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          Write-Host "Release directory: $releaseDir"

          if (Test-Path "$releaseDir\arena.exe") {
            Copy-Item "$releaseDir\arena.exe" "$releaseDir\Arena.exe" -Force
          }

          if (Get-Command tar.exe -ErrorAction SilentlyContinue) {
            tar.exe -a -c -f dist\Arena-Windows-x64.zip -C $releaseDir .
          } else {
            Compress-Archive -Path "$releaseDir\*" -DestinationPath dist\Arena-Windows-x64.zip
          }
          Get-ChildItem dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Arena-Windows-x64
          path: dist/Arena-Windows-x64.zip
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: desktop-v2.0
          name: "Arena POS — Desktop Versiyalari (v2.0)"
          body: |
            Arena POS — Sport maydonlari va o'yin klublari boshqaruv tizimi (Windows & Linux).
            
            Windows x64:
            - `Arena-Windows-x64.zip` (ichida `Arena.exe`, `data/`, DLL fayllari)
          files: dist/Arena-Windows-x64.zip
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
