name: Build Champion Windows App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Champion Windows (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Flutter Doctor
        run: flutter doctor -v

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release Executable
        shell: pwsh
        run: |
          flutter build windows --release -v 2>&1 | Tee-Object -FilePath build_output.txt
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Flutter build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

      - name: Publish Failure Log (if failed)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-failure
          name: "Build Failure Log"
          files: build_output.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          if (Test-Path build\windows\x64\runner\Release\arena.exe) {
            Copy-Item build\windows\x64\runner\Release\arena.exe build\windows\x64\runner\Release\Champion.exe
          }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\Champion-Windows-x64.zip
          Get-ChildItem -Path dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Champion-Windows-x64
          path: dist\Champion-Windows-x64.zip
          retention-days: 30

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: desktop-v2.0
          name: "Champion POS — Windows Desktop Versiyasi (v2.0)"
          body: |
            Champion POS — Sport maydonlari va o'yin klublari boshqaruv tizimi (Windows x64).
            
            Arxiv ichida:
            - `Champion.exe`
            - `data/` va barcha zaruriy tizim DLL kutubxonalari.
          files: dist\Champion-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
